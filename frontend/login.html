<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in · Scrobbler</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%231c2330'/%3E%3Ccircle cx='8' cy='8' r='3.5' fill='%23f2a541'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/style.css">
    <script src="config.js"></script>
    <script type="module" src="js/login.js"></script>
  </head>
  <body>
    <header class="site-header" id="site-header"></header>
    <main id="main">
    <div class="auth">
      <h1>Sign in</h1>
      <p class="lede">See what you've been listening to.</p>
      <div id="messages"></div>
      <form id="login" novalidate>
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="button" type="submit">Sign in</button>
      </form>
      <p class="auth-alt">New here? <a href="register.html">Create an account</a></p>
    </div>
    </main>
  </body>
</html>
