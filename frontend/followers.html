<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Followers · Scrobbler</title>
    <link rel="icon" href="favicon.ico" sizes="48x48">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">
    <meta name="theme-color" content="#1F1C28">
    <link rel="stylesheet" href="css/style.css">
    <script src="config.js"></script>
    <script type="module" src="js/followers.js"></script>
  </head>
  <body>
    <header class="site-header" id="site-header"></header>
    <main id="main">
    <h1 class="page-title">Followers</h1>
    <p class="lede">People on the fediverse who follow your listening. <a href="sharing.html">Sharing settings</a></p>
    <div id="messages"></div>
    <section aria-labelledby="requests-title" id="requests-section" hidden>
      <h2 id="requests-title" class="section-head">Follow requests</h2>
      <ul class="rows" id="requests"></ul>
    </section>
    <section aria-labelledby="followers-title">
      <h2 id="followers-title" class="section-head">Followers</h2>
      <ul class="rows" id="followers"></ul>
    </section>
    <section aria-labelledby="blocks-title" id="blocks-section" hidden>
      <h2 id="blocks-title" class="section-head">Blocked</h2>
      <ul class="rows" id="blocks"></ul>
    </section>
    </main>
  </body>
</html>
