<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create an account · Scrobbler</title>
    <link rel="icon" href="favicon.ico" sizes="48x48">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">
    <meta name="theme-color" content="#1F1C28">
    <link rel="stylesheet" href="css/style.css">
    <script src="config.js"></script>
    <script type="module" src="js/register.js"></script>
  </head>
  <body>
    <header class="site-header" id="site-header"></header>
    <main id="main">
    <div class="auth">
      <h1>Create an account</h1>
      <p class="lede">Your listening history stays on this server.</p>
      <div id="messages"></div>
      <form id="register" novalidate>
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" autocomplete="username" required minlength="2" maxlength="32" pattern="[A-Za-z0-9_.\-]+" aria-describedby="username-hint">
          <span class="hint" id="username-hint">Letters, numbers, dots, dashes and underscores. Players use this to sign in.</span>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" aria-describedby="password-hint">
          <span class="hint" id="password-hint">At least 8 characters.</span>
        </div>
        <button class="button" type="submit">Create account</button>
      </form>
      <p class="auth-alt">Already have an account? <a href="login.html">Sign in</a></p>
    </div>
    </main>
  </body>
</html>
