services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: scrobbler
      POSTGRES_PASSWORD: scrobbler
      POSTGRES_DB: scrobbler
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./deploy/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scrobbler"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
