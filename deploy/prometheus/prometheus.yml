global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: scrobbler-api
    static_configs:
      - targets: ["api:9100"]

  - job_name: scrobbler-worker
    static_configs:
      - targets: ["worker:9101"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
